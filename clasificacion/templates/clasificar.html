{% extends "base.html" %}
{% load static %}
{% block content %}
  

<div class="cont">
    
  <form method="post" class="formulario" enctype="multipart/form-data">
    <h2>Cargar datos desde Excel</h2>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Cargar</button>
  </form>
  </div>
  
  {% if messages %}
    {% for message in messages %}
      <div class="alerta">{{ message }}</div>
    {% endfor %}
  {% endif %}
{% endblock %}
